<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Elah</title>
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#faf8f4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#171614" media="(prefers-color-scheme: dark)">
<meta name="description" content="Read the Bible in nine versions, as real text. Opens on David and Goliath.">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="icon" href="favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="stylesheet" href="tokens.css">
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100dvh;display:flex;flex-direction:column;background:var(--bg);color:var(--text);font:var(--size-body)/24px var(--font)}
header{display:flex;flex-wrap:wrap;align-items:center;gap:var(--s3);padding:var(--s3) var(--page);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:var(--s3);font-size:var(--size-title);line-height:28px;font-weight:700}
.brand img{width:32px;height:32px}
form{display:flex;min-width:0;gap:var(--s2);flex:1 1 360px;max-width:var(--measure);margin-left:var(--s4)}
input,select,button{height:var(--control);font:inherit;color:var(--text);background:var(--surface);border:1px solid var(--line);border-radius:var(--r-pill);padding:0 var(--s4);transition:background var(--ease),border-color var(--ease)}
input{flex:1;min-width:0}
select{padding-right:var(--s3)}
button{cursor:pointer;font-weight:600}
button.go{background:var(--accent);border-color:var(--accent);color:#fff}
@media(prefers-color-scheme:dark){button.go{background:#2f66d0;border-color:#2f66d0}}
button:hover:not(.go){background:var(--line)}
:is(input,select,button):focus-visible{outline:0;box-shadow:0 0 0 4px var(--accent-ring);border-color:var(--accent)}
@media(max-width:640px){.brand{margin-right:auto}form{order:3;flex-basis:100%;max-width:none;margin-left:0}}
main{width:100%;max-width:var(--measure);margin:0 auto;padding:var(--s6) var(--page) var(--s7)}
main h1{font-size:var(--size-title);line-height:32px;margin:0 0 var(--s4)}
main p{margin:0 0 var(--s3);font-size:19px;line-height:30px}
main sup{color:var(--text2,#888);font-size:12px;font-weight:600;margin-right:4px}
nav{display:flex;justify-content:space-between;gap:var(--s3);margin-top:var(--s6)}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header>
  <a class="brand" href="/" style="color:inherit;text-decoration:none"><img src="icon.svg" alt="">Elah</a>
  <form id="f">
    <input id="q" value="1 Samuel 17" aria-label="Passage" autocapitalize="off" autocomplete="off">
    <select id="v" aria-label="Version"></select>
    <button class="go">Go</button>
  </form>
  <button type="button" id="home" title="1 Samuel 17">David and Goliath</button>
</header>
<main id="r" aria-live="polite"><p>Loading the King James text...</p></main>
<script>
// Every version is public domain and bundled, the same text the app reads. No frame, no ads.
const HOME='1 Samuel 17',VERSIONS=[["KJV","King James Version"],["BSB","Berean Standard Bible"],["ASV","American Standard Version"],["NHEB","New Heart English Bible"],["YLT","Young's Literal Translation"],["Darby","Darby Bible"],["Webster","Webster Bible"],["BBE","Bible in Basic English"],["Geneva","Geneva Bible (1599)"]];
const f=document.getElementById('f'),q=document.getElementById('q'),r=document.getElementById('r'),v=document.getElementById('v');
v.innerHTML=VERSIONS.map(([c,t])=>'<option value="'+c+'" title="'+t+'">'+c+'</option>').join('');
const cache={};
const load=c=>cache[c]||(cache[c]=fetch('v/'+c.toLowerCase()+'.json').then(x=>{if(!x.ok)throw 0;return x.json()}));
const norm=t=>t.toLowerCase().replace(/[^a-z0-9]/g,'');
let bible=[];
const esc=t=>t.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
function find(ref){
  const m=ref.trim().match(/^(.+?)\s*(\d+)?(?::(\d+)(?:\s*-\s*(\d+))?)?$/);
  if(!m)return null;
  const key=norm(m[1]);
  const b=bible.findIndex(x=>norm(x.name)===key)>-1?bible.findIndex(x=>norm(x.name)===key):bible.findIndex(x=>norm(x.name).startsWith(key));
  if(b<0)return null;
  const c=+(m[2]||1),ch=bible[b].chapters[c-1];
  if(!ch)return null;
  const from=+(m[3]||1),to=+(m[4]||m[3]||ch.length);
  return {b,c,from:Math.max(1,from),to:Math.min(ch.length,to)};
}
function show(ref){
  const p=find(ref);
  if(!p){r.innerHTML='<p>No passage called "'+esc(ref)+'". Try Psalm 23 or John 3:16.</p>';return}
  const {b,c,from,to}=p,book=bible[b],verses=book.chapters[c-1];
  const title=book.name+' '+c+(from>1||to<verses.length?':'+from+(to>from?'-'+to:''):'');
  let h='<h1>'+esc(title)+'</h1>';
  for(let i=from;i<=to;i++)if(verses[i-1])h+='<p><sup>'+i+'</sup>'+esc(verses[i-1])+'</p>';
  const prev=c>1?book.name+' '+(c-1):b>0?bible[b-1].name+' '+bible[b-1].chapters.length:null;
  const next=c<book.chapters.length?book.name+' '+(c+1):b<bible.length-1?bible[b+1].name+' 1':null;
  h+='<nav>'+(prev?'<button type="button" data-go="'+prev+'">&larr; '+esc(prev)+'</button>':'<span></span>')+(next?'<button type="button" data-go="'+next+'">'+esc(next)+' &rarr;</button>':'')+'</nav>';
  r.innerHTML=h;document.title=title+' '+v.value+' · Elah';q.value=title;
}
r.onclick=e=>{const g=e.target.closest('[data-go]');if(g){show(g.dataset.go);scrollTo(0,0)}};
f.onsubmit=e=>{e.preventDefault();show(q.value)};
document.getElementById('home').onclick=()=>show(HOME);
const use=()=>load(v.value).then(d=>{bible=d;show(q.value)}).catch(()=>{r.innerHTML='<p>Could not load the text. Reload to try again.</p>'});
v.onchange=use;
const qs=new URLSearchParams(location.search);
if(VERSIONS.some(([c])=>c===qs.get('v')))v.value=qs.get('v');
if(qs.get('q'))q.value=qs.get('q');
use();
</script>
</body>
</html>
