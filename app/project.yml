name: Bible
options:
  bundleIdPrefix: com.nulljosh
  developmentLanguage: en
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
settings:
  # One version for iPhone, iPad and Mac. Bump both every release.
  MARKETING_VERSION: "0.3.0"
  CURRENT_PROJECT_VERSION: 202610302200
  SWIFT_VERSION: "5.9"
targets:
  Bible:
    type: application
    supportedDestinations: [iOS, macOS]
    sources:
      - Sources
      - path: ../Bible.icon
        buildPhase: resources
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.nulljosh.bible
      ASSETCATALOG_COMPILER_APPICON_NAME: Bible
      GENERATE_INFOPLIST_FILE: YES
      INFOPLIST_KEY_CFBundleDisplayName: Bible
      INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
      INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
      INFOPLIST_KEY_UILaunchScreen_Generation: YES
      INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
      INFOPLIST_KEY_UISupportedInterfaceOrientations~ipad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
      INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.books
      DEVELOPMENT_TEAM: QMM486NPYC
      CODE_SIGN_STYLE: Automatic
      ENABLE_APP_SANDBOX: YES
      ENABLE_OUTGOING_NETWORK_CONNECTIONS: YES
  BibleTests:
    type: bundle.unit-test
    supportedDestinations: [iOS, macOS]
    sources: [Tests]
    dependencies:
      - target: Bible
    settings:
      GENERATE_INFOPLIST_FILE: YES
      TEST_HOST[sdk=macosx*]: "$(BUILT_PRODUCTS_DIR)/Bible.app/Contents/MacOS/Bible"
      TEST_HOST[sdk=iphone*]: "$(BUILT_PRODUCTS_DIR)/Bible.app/Bible"
      BUNDLE_LOADER: "$(TEST_HOST)"
schemes:
  Bible:
    build:
      targets: {Bible: all, BibleTests: [test]}
    test:
      targets: [BibleTests]
